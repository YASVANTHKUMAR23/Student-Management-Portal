{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow">
<div class="card-body">
{% if validlink %}
<h3 class="text-center mb-4">Set a New Password</h3>
<form method="POST">
{% csrf_token %}
{{ form.as_p }}
<button class="btn btn-success w-100">Reset Password</button>
</form>
{% else %}
<h3 class="text-center mb-3">Invalid Link</h3>
<p class="text-muted text-center">
    This password reset link is invalid, possibly because it has already been used.
</p>
<a href="{% url 'password_reset' %}" class="btn btn-primary w-100">Request a new link</a>
{% endif %}
</div>
</div>
</div>
</div>
{% endblock %}
