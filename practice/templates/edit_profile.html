{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body">

<h2>

Edit Profile

</h2>

<hr>

<form

method="POST"

enctype="multipart/form-data">

{% csrf_token %}

{{ user_form.as_p }}

{{ profile_form.as_p }}

<button

class="btn btn-success">

Save Changes

</button>

<a

href="{% url 'profile' %}"

class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
